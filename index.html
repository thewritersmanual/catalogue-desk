  const ORDER = ['id', 'handle', 'sku', ...RECIPE, 'name', 'description', 'product_category', 'tags', 'supply_price', 'retail_price', 'tax_name', 'brand_name', 'supplier_name', 'supplier_code', 'active', 'track_inventory'];
  const own = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);
  const str = value => value == null ? '' : String(value);
  const key = value => str(value).trim().normalize('NFKC').toLowerCase();
  const fail = message => { throw new Error(message); };
  const unique = arr => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'en-GB'));
  const addIssue = (p, issue) => { if (!p.issues.includes(issue)) p.issues.push(issue); };

  function groupBy(products, field, normalize = key) {
    const map = new Map();
    for (const product of products) {
      const value = normalize(product[field]);
      if (!map.has(value)) map.set(value, []);
      map.get(value).push(product);
    }
    return map;
  }

  function validateHeader(rows) {
    if (!Array.isArray(rows) || !rows.length) fail('Load a complete Lightspeed product export with at least one product.');
    const headers = new Set();
    for (const row of rows) {
      if (!row || typeof row !== 'object' || Array.isArray(row)) fail('Each catalogue row must have named export columns.');
      Object.keys(row).forEach(k => headers.add(k));
    }
    const missing = REQUIRED.filter(f => !headers.has(f));
    if (missing.length) fail('This is not a full Lightspeed catalogue export. Missing columns: ' + missing.join(', ') + '.');
    return [...headers];
  }

  function rowValues(source) {
    for (const f of ['id', 'sku', 'handle', 'composite_sku']) {
      if (source[f] != null && typeof source[f] !== 'string') fail('Load ' + f + ' as text. Numeric conversion can lose leading zeroes or barcode digits.');
    }
    return Object.fromEntries(Object.entries(source).map(([f, v]) => [f, str(v)]));
  }

  function recipeRowLooksPresent(row) {
    return RECIPE.some(f => str(row[f]) !== '');
  }

  function unsafeRecord(product) {
    const row = product.row;
    for (const f of IDENTITY) {
      if (!str(row[f]).trim()) addIssue(product, 'Missing ' + f + ' on the catalogue row.');
    }
    if (Object.keys(row).some(f => /^variant_option_/i.test(f) && row[f].trim())) {
      product.kind = 'variant';
      addIssue(product, 'This SKU belongs to a variant family. Edit its full family in Lightspeed.');
    }
    const declared = key(row.product_type || row.product_structure);
    if (declared && !['standard','standard product','composite','composite product','variant','variant product'].includes(declared))
      addIssue(product, 'The export declares an unsupported product structure: ' + declared + '.');
    if (declared.startsWith('variant')) {
      product.kind = 'variant';
      addIssue(product, 'This SKU belongs to a variant family. Edit its full family in Lightspeed.');
    }
    if (['vend-discount','vend-giftcard','vend-gift-card','vend-cash-management'].includes(key(product.sku)) ||
        /^vend-(discount|gift.?card)(?:$|-)/i.test(product.handle)) {
      addIssue(product, 'This is a special Lightspeed line. Use the Lightspeed controls for this item.');
    }
  }

  function index(sourceRows) {
    const headers = validateHeader(sourceRows);
    const rows = sourceRows.map(rowValues).filter(r => Object.values(r).some(v => v.trim() !== ''));
    const products = [];
    const ingredients = [];
    for (const row of rows) {
      if (recipeRowLooksPresent(row)) { ingredients.push(row); continue; }
      const p = {id: row.id, handle: row.handle, sku: row.sku, name: row.name, row, components: [], kind: 'standard', issues: []};
      unsafeRecord(p);
      products.push(p);
    }
    if (!products.length) fail('No parent or standard product rows were found.');
    const lookup = {};
    for (const f of ['id','sku','handle','name']) {
      lookup[f] = groupBy(products, f);
      for (const [v, hits] of lookup[f]) {
        if (v && hits.length > 1) for (const product of hits) addIssue(product, 'The catalogue contains more than one product with this ' + f + '.');
      }
    }
    const problems = [];
    for (const row of ingredients) {
      const candidates = lookup.id.get(key(row.id)) || [];
      if (candidates.length !== 1 || !row.id) {
        const issue = 'Recipe for ' + (row.sku || '(missing SKU)') + ' has no unique parent ID.';
        problems.push(issue);
        for (const product of lookup.sku.get(key(row.sku)) || []) addIssue(product, issue);
        continue;
      }
      const product = candidates[0];
      if (product.kind !== 'variant') product.kind = 'composite';
      product.components.push(row);
      if (row.id !== product.id || row.sku !== product.sku || row.name !== product.name ||
          (row.handle && row.handle !== product.handle)) {
        const issue = 'A recipe row does not agree with the parent identity.';
        addIssue(product, issue);
        for (const other of lookup.sku.get(key(row.sku)) || []) addIssue(other, issue);
        for (const other of lookup.handle.get(key(row.handle)) || []) addIssue(other, issue);
      }
      if (!row.composite_sku || !row.composite_name || !/^\d+(?:\.\d+)?$/.test(row.composite_quantity) || Number(row.composite_quantity) <= 0)
        addIssue(product, 'A recipe is missing an exact component name, SKU or positive stock quantity.');
    }
    for (const p of products) {
      if (/^composite/i.test(p.row.product_type || p.row.product_structure || '') && !p.components.length)
        addIssue(p, 'The catalogue declares a composite but supplies no recipe.');
      if (/^standard/i.test(p.row.product_type || p.row.product_structure || '') && p.components.length)
        addIssue(p, 'The catalogue declares a standard product but supplies a recipe.');
      const seen = new Set();
      for (const c of p.components) {
        if (seen.has(key(c.composite_sku))) addIssue(p, 'A component SKU is repeated in the recipe; verify the original in Lightspeed.');
        seen.add(key(c.composite_sku));
        const stock = lookup.sku.get(key(c.composite_sku)) || [];
        if (stock.length !== 1 || stock[0].sku !== c.composite_sku || stock[0].name !== c.composite_name) {
          addIssue(p, 'The recipe component "' + c.composite_sku + '" does not match one catalogue product by exact SKU and name.');
        } else if (!eligibleComponent(stock[0]) || stock[0].id === p.id) {
          addIssue(p, 'The recipe contains a nested composite, self-reference or ambiguous component. Inspect it in Lightspeed.');
        }
      }
    }
    // Keep alias barcodes reserved too when the export exposes them.
    const reservedSkus = new Set();
    for (const row of rows) {
      for (const [f, value] of Object.entries(row)) {
        if (f === 'sku' || f === 'composite_sku' || /^(?:sku|barcode)(?:_|_code_)\d+$/.test(f)) {
          if (value) reservedSkus.add(key(value));
        }
      }
    }
    return {
      products, headers, byId: groupBy(products, 'id', str), bySku: groupBy(products, 'sku', str),
      categories: unique(products.map(p => p.row.product_category)),
      tags: unique(products.flatMap(p => str(p.row.tags).split(';').map(s => s.trim()))),
      taxes: unique(['Default Tax', ...products.map(p => p.row.tax_name)]),
      brands: unique(products.map(p => p.row.brand_name)), suppliers: unique(products.map(p => p.row.supplier_name)),
      issues: problems, counts: {products: products.length, components: ingredients.length, needsReview: products.filter(p => p.issues.length).length},
      lookup, reservedSkus, reservedHandles: new Set(rows.map(r => key(r.handle)).filter(Boolean)),
      reservedNames: new Set(rows.map(r => key(r.name)).filter(Boolean))
    };
  }

  function productForEdit(catalogue, id) {
    const hits = catalogue.byId.get(id) || [];
    if (hits.length !== 1) fail('The selected product ID does not identify one catalogue item. Refresh the catalogue.');
    const p = hits[0];
    if (p.issues.length) fail(p.name + ': ' + p.issues.join(' '));
    return p;
  }

  function baselines(p, fields) {
    const old = Object.fromEntries([...new Set([...IDENTITY, ...fields])].map(f => [f, str(p.row[f])]));
    old.recipe = p.components.map(c => RECIPE.map(f => c[f]));
    return old;
  }

  function eligibleComponent(product) {
    if (product.kind === 'standard') return !product.issues.length;
    if (product.kind !== 'variant') return false;
    // A specific variant may supply stock even though its family cannot be edited here.
    const hasOption = Object.entries(product.row).some(([field,value]) => /^variant_option_.*_value$/i.test(field) && value);
    const familyIssues = new Set(['This SKU belongs to a variant family. Edit its full family in Lightspeed.',
      'The catalogue contains more than one product with this handle.', 'The catalogue contains more than one product with this name.']);
    return hasOption && product.issues.every(issue => familyIssues.has(issue));
  }

  function catalogueRecipe(catalogue, product) {
    return product.components.map(c => {
      const matches = catalogue.bySku.get(c.composite_sku);
      return {id:matches?.length === 1 ? matches[0].id : '', sku:c.composite_sku,
        name:c.composite_name, quantity:c.composite_quantity};
    });
  }

  function comparableQuantity(value) {
    const text = str(value).trim();
    if (!/^\d+(?:\.\d+)?$/.test(text)) return text;
    const [whole, fraction = ''] = text.split('.');
    const significantFraction = fraction.replace(/0+$/, '');
    return whole.replace(/^0+(?=\d)/, '') + (significantFraction ? '.' + significantFraction : '');
  }

  function recipeDifferences(before, after) {
    const previous = new Map(before.map(r => [r.sku,r])), proposed = new Map(after.map(r => [r.sku,r]));
    const differences = [];
    for (const sku of new Set([...previous.keys(),...proposed.keys()])) {
      const old = previous.get(sku), next = proposed.get(sku);
      const status = !old ? 'Added' : !next ? 'Removed' :
        (old.id && next.id && old.id !== next.id) || old.name !== next.name ? 'Identity changed' :
        comparableQuantity(old.quantity) !== comparableQuantity(next.quantity) ? 'Units changed' : '';
      if (status) differences.push({sku,name:(next || old).name,before:old?.quantity ?? '',after:next?.quantity ?? '',status});
    }
    return differences;
  }

  function checkedRecipe(catalogue, product, proposed, staged) {
    if (!Array.isArray(proposed) || !proposed.length) fail('Keep at least one component in ' + product.name + '.');
    const seen = new Set();
    return proposed.map(item => {
      if (!item || typeof item.sku !== 'string' || !item.sku || typeof item.id !== 'string') fail('Select a catalogue component with an exact SKU.');
      const matches = catalogue.bySku.get(item.sku) || [];
      const pending = staged.get(key(item.sku));
      const existing = matches.length === 1 && eligibleComponent(matches[0]) ? matches[0] : null;
      const stock = pending || existing?.row;
      if (!stock || stock.id !== item.id || stock.sku !== item.sku || stock.name !== item.name || stock.id === product.id)
        fail('Recipe component ' + item.sku + ' no longer matches the selected stock item. Select it again.');
      if (seen.has(key(item.sku))) fail('Component ' + item.sku + ' is already in this recipe. Change its units instead.');
      seen.add(key(item.sku));
      const quantity = str(item.quantity).trim();
      if (!/^\d+(?:\.\d+)?$/.test(quantity) || !/[1-9]/.test(quantity)) fail('Enter positive units per sale for ' + item.name + '.');
      if (quantity.length > 40 || quantity.replace('.', '').replace(/^0+/, '').length > 15)
        fail('Use no more than 15 significant digits for units per sale on ' + item.name + '.');
      return {id:stock.id,sku:stock.sku,name:stock.name,quantity};
    });
  }

  function checkImportedRecipe(catalogue, action) {
    const matches = catalogue.byId.get(action.id) || [];
    const product = matches[0];
    if (matches.length !== 1 || product.kind !== 'composite' || product.issues.length ||
        product.sku !== action.expected?.sku || product.handle !== action.expected?.handle)
      return {status:'Cannot identify the original composite',differences:[]};
    const differences = recipeDifferences(action.recipe, catalogueRecipe(catalogue,product));
    return {status:differences.length ? 'Catalogue differs' : 'Recipe matches',differences};
  }

  function resolveBase(catalogue, sku, staged) {
    const base = staged.get(key(sku));
    if (!str(sku).trim()) fail('A component needs an explicit stock SKU.');
    if (base) {
      if (base.sku !== sku) fail('Enter the exact staged component SKU, including letter case.');
      return base;
    }
    const hits = catalogue.bySku.get(sku) || [];
    if (hits.length !== 1) fail('The component SKU "' + sku + '" must match exactly one existing or staged stock product.');
    const product = hits[0];
    if (product.issues.length || product.kind !== 'standard') fail('Choose a standard stock product with an unambiguous identity for the bottle or keg.');
    return product.row;
  }

  function bind(catalogue, action) {
    const copy = JSON.parse(JSON.stringify(action));
    if (copy.kind === 'edit') {
      const p = productForEdit(catalogue, copy.id);
      copy.expected = baselines(p, Object.keys(copy.fields || {}));
      if (own(copy,'recipe')) {
        if (p.kind !== 'composite') fail('Only an existing composite can have its recipe edited here.');
        copy.expectedComponentIds = catalogueRecipe(catalogue,p).map(c=>c.id);
      }
    }
    if (copy.kind === 'pours') {
      const hits = catalogue.bySku.get(copy.baseSku) || [];
      if (hits.length === 1) copy.expectedBase = baselines(hits[0], ['supply_price','track_inventory']);
    }
    return copy;
  }

  function decimal(value, label, places, positive = false) {
    const v = str(value).trim();
    const re = new RegExp('^\\d{1,12}(?:\\.\\d{1,' + places + '})?$');
    if (!re.test(v) || (positive && Number(v) <= 0))
      fail('Enter ' + label + ' as a ' + (positive ? 'positive' : 'non-negative') + ' number with up to ' + places + ' decimal places.');
    return v;
  }

  // Fixed-point arithmetic keeps the fractions printed in the preview identical to the import.
  function decimalInteger(value) {
    const [whole, fraction = ''] = str(value).split('.');
    return {n: BigInt(whole + fraction), d: 10n ** BigInt(fraction.length)};
  }
  function roundedFraction(n, d, places) {
    const scale = 10n ** BigInt(places);
    const scaled = (n * scale * 2n + d) / (2n * d);
    const digits = scaled.toString().padStart(places + 1, '0');
    return (digits.slice(0, -places) + '.' + digits.slice(-places)).replace(/0+$/, '').replace(/\.$/, '');
  }
  function pourFactor(volumeMl, baseVolumeMl) {
    const v = decimalInteger(decimal(volumeMl, 'serve volume (ml)', 6, true));
    const b = decimalInteger(decimal(baseVolumeMl, 'volume in one stock unit (ml)', 6, true));
    if (v.n * b.d > b.n * v.d) fail('The serving volume is larger than one bottle or keg. Check both volumes in millilitres.');
    const factor = roundedFraction(v.n * b.d, v.d * b.n, 5);
    if (factor === '0') fail('The component quantity rounds to zero at five decimal places. Check the units.');
    return factor;
  }
  function componentCost(price, factor) {
    const a = decimalInteger(decimal(price, 'stock unit supply price', 6));
    const b = decimalInteger(factor);
    return roundedFraction(a.n * b.n, a.d * b.d, 5);
  }

  function safeText(value, label, allowLineBreaks = false) {
    const s = str(value);
    const checked = allowLineBreaks ? s.replace(/[\r\n]/g,' ') : s;
    if (/[\u0000-\u001f\u007f]/.test(checked) || /^[\s]*[=+@]/.test(s) || /^\s*-(?:\d|[A-Za-z]+\s*\(|[A-Za-z]+\d+\b)/.test(s))
      fail(label + ' contains a control character or starts like a spreadsheet formula.');
    return s;
  }

  function allowedFields(fields, allowed) {
    if (!fields || typeof fields !== 'object' || Array.isArray(fields)) fail('Supply the fields to be changed.');
    for (const f of Object.keys(fields)) if (!allowed.includes(f)) fail('The field "' + f + '" cannot be written by this editor.');
  }

  function fieldValue(catalogue, f, input) {
    if (f === 'retail_price') return decimal(input, 'selling price', 2);
    if (f === 'supply_price') return decimal(input, 'supply price', 6);
    const value = safeText(input, f, f === 'description').trim();
    if (f === 'active' || f === 'track_inventory') {
      if (value !== '0' && value !== '1') fail('Choose 0 or 1 for ' + f + '.');
    }
    if (f === 'tax_name' && !catalogue.taxes.includes(value)) fail('Choose an exact tax name from the catalogue, or Default Tax.');
    if (f === 'tags') {
      if (value.includes(',')) fail('Separate tags with semicolons, in the shop’s export format.');
      const labels = value.split(';').map(v => v.trim()).filter(Boolean);
      if (new Set(labels.map(key)).size !== labels.length) fail('Each tag should appear once.');
      return labels.join(';');
    }
    if (f === 'product_category' && value) {
      if (catalogue.categories.includes(value)) return value;
      const parts = value.split('/').map(v => v.trim());
      if (parts.some(v => !v)) fail('A category path cannot include an empty level.');
      if (parts.length > 3) fail('Lightspeed category paths support up to three levels.');
      if (parts.length>1) fail('Create the new category hierarchy in Lightspeed first; then load its exact exported category value.');
      return parts[0];
    }
    return value;
  }

  function validateNew(catalogue, fields, reserved, isPour) {
    allowedFields(fields, NEW_FIELDS);
    const row = {id: ''};
    for (const f of ['handle','name','retail_price','supply_price','tax_name', ...(isPour ? ['sku'] : [])]) {
      if (fields[f] == null || !str(fields[f]).trim()) fail('Enter ' + f + ' for the new ' + (isPour ? 'serve' : 'product') + '.');
    }
    for (const [f, value] of Object.entries(fields)) row[f] = fieldValue(catalogue, f, value);
    row.sku = row.sku || '';
    if (row.sku && !/^[A-Za-z0-9]+$/.test(row.sku)) fail('New SKUs must contain only letters and numbers, with no spaces.');
    if (!/^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$/.test(row.handle)) fail('Use letters, numbers and hyphens between words for the new handle.');
    for (const f of ['sku','handle','name']) {
      if (f === 'sku' && !row.sku) continue;
      const k = key(row[f]);
      if (reserved[f].has(k)) fail('The ' + f + ' "' + row[f] + '" already exists in the catalogue or this batch.');
      reserved[f].add(k);
    }
    row.active = own(row, 'active') ? row.active : '1';
    if (isPour) {
      if (own(row, 'track_inventory')) fail('Composite stock comes from its component. Omit track_inventory on a serve.');
    } else {
      row.track_inventory = own(row, 'track_inventory') ? row.track_inventory : '1';
    }
    return row;
  }

  function identity(row) {
    return Object.fromEntries(IDENTITY.map(f => [f, str(row[f])]));
  }

  function addChanges(changes, kind, row, field, before, after) {
    changes.push({kind, id: row.id || '', name: row.name, handle: row.handle, sku: row.sku, field, before: str(before), after: str(after)});
  }

  function collectEdits(catalogue, actions) {
    const edits = new Map();
    for (const action of actions.filter(a => a.kind === 'edit')) {
      const p = productForEdit(catalogue, action.id);
      allowedFields(action.fields, EDIT_FIELDS);
      const fields = Object.keys(action.fields);
      const changesRecipe=own(action,'recipe');
      if (!fields.length && !changesRecipe) fail('Select at least one field to change on ' + p.name + '.');
      if (changesRecipe && (p.kind !== 'composite' || !action.expected ||
          JSON.stringify(action.expectedComponentIds) !== JSON.stringify(catalogueRecipe(catalogue,p).map(c=>c.id))))
        fail('The original recipe identities are missing or have changed for ' + p.name + '. Review its recipe again.');
      if (action.expected && JSON.stringify(action.expected) !== JSON.stringify(baselines(p, fields)))
        fail('The original identity, recipe or value for ' + p.name + ' changed since this edit was staged. Review it again.');
      const entry = edits.get(p.id) || {product: p, fields: {}};
      if (changesRecipe) {
        if (own(entry,'recipe')) fail('Two staged recipes refer to ' + p.name + '. Keep a single recipe edit.');
        entry.recipe = action.recipe;
      }
      for (const f of fields) {
        if (!catalogue.headers.includes(f)) fail('The source export does not include ' + f + ' to compare.');
        const val = fieldValue(catalogue, f, action.fields[f]);
        if (own(entry.fields, f) && entry.fields[f] !== val) fail('Two staged changes disagree about ' + f + ' for ' + p.name + '.');
        entry.fields[f] = val;
      }
      edits.set(p.id, entry);
    }
    return edits;
  }

  function equivalent(field, a, b) {
    if (a === b) return true;
    if (field === 'tags') {
      const tags = value => str(value).split(';').map(tag=>tag.trim()).filter(Boolean).join(';');
      return tags(a) === tags(b);
    }
    return ['supply_price','retail_price'].includes(field) && /^\d+(?:\.\d+)?$/.test(a) && Number(a) === Number(b);
  }

  function makeGroup(groups, mode, label, heads, rows) {
    const headers = ORDER.filter(h => heads.includes(h));
    const signature = mode + '|' + headers.join(',');
    if (!groups.has(signature)) groups.set(signature, {mode, label, headers, rows: []});
    groups.get(signature).rows.push(...rows);
  }

  function componentRow(product, c) {
    return {...identity(product), ...Object.fromEntries(RECIPE.map(f => [f, str(c[f])]))};
  }

  function csv(headers, rows) {
    // Quote every cell, retaining the raw identifier exactly. The importer reads text.
    const line = cells => cells.map((cell,i) => {
      // Some exported names contain a tab between words. Retain it in the quoted
      // identity cell while still rejecting leading controls or formula-like text.
      const value = str(cell), name = headers[i] === 'name' || headers[i] === 'composite_name';
      safeText(name ? value.replace(/(\S)\t+(?=\S)/g,'$1 ') : value,'Export field ' + headers[i],headers[i] === 'description');
      return '"' + value.replaceAll('"','""') + '"';
    }).join(',');
    return '\uFEFF' + [line(headers), ...rows.map(row => line(headers.map(f => str(row[f]))))].join('\r\n') + '\r\n';
  }

  function describeNew(changes, kind, row) {
    for (const field of Object.keys(row)) if (field !== 'id' && row[field] !== '') addChanges(changes, kind, row, field, '', row[field]);
  }

  function preview(catalogue, actions) {
    if (!catalogue || !(catalogue.byId instanceof Map)) fail('Load a Lightspeed catalogue first.');
    if (!Array.isArray(actions)) fail('Supply an array of staged actions.');
    for (const a of actions) if (!a || !['edit','standard','pours'].includes(a.kind)) fail('Unsupported catalogue action.');
    const groups = new Map(), changes = [], warnings = [], staged = new Map();
    const reserved = {sku: new Set(catalogue.reservedSkus), handle: new Set(catalogue.reservedHandles), name: new Set(catalogue.reservedNames)};
    const edits = collectEdits(catalogue, actions);

    for (const action of actions.filter(a => a.kind === 'standard')) {
      const row = validateNew(catalogue, action.fields, reserved, false);
      if (row.sku) staged.set(key(row.sku), row);
      else warnings.push(row.name + ' has a blank SKU. Check its generated code in the Lightspeed import preview and a fresh export.');
      describeNew(changes, 'New standard', row);
      makeGroup(groups, 1, 'New standard products', Object.keys(row), [row]);
      if (Number(row.supply_price) === 0) warnings.push(row.name + ' has an explicit zero supply price. Check the cost before receiving stock.');
    }

    for (const entry of edits.values()) {
      const {product, fields}=entry;
      const changed = Object.keys(fields).filter(f => !equivalent(f, str(product.row[f]), fields[f]));
      let components=product.components, difference=[];
      if (own(entry,'recipe')) {
        const original=catalogueRecipe(catalogue,product);
        const recipe=checkedRecipe(catalogue,product,entry.recipe,staged);
        difference=recipeDifferences(original,recipe);
        if (difference.length) {
          changes.push({kind:'Edit',id:product.id,name:product.name,handle:product.handle,sku:product.sku,
            field:'Recipe',before:original.length+' component(s)',after:recipe.length+' component(s)',recipeChanges:difference});
          components=recipe.map(c=>({composite_name:c.name,composite_sku:c.sku,composite_quantity:c.quantity}));

  el('bulkpicked').textContent=plural(bulkSelected.size,'product')+' selected';
  el('bulkreview').disabled=!bulkSelected.size;
}
function drawBulkResults(){
  if(!bulkCache)bulkCache=Bulk.catalogueRows(cat);
  const unknown=bulkFilters.marginMode==='unknown';
  for(const key of ['minMargin','maxMargin'])el('bf-'+key).disabled=unknown;
  let matches=[],problem='';
  try{matches=Bulk.matches(bulkCache,bulkFilters);}catch(e){problem=e.message;}
  const eligible=matches.filter(row=>!row.product.issues.length);
  const close=matches.filter(row=>row.close).length;
  const slice=pageSlice(matches,bulkPage);bulkPage=slice.index;
  bulkSelectionSummary();
  el('bulkcount').textContent=problem || total(matches.length)+(matches.length===1?' match':' matches')+
    (close?' · '+plural(close,'close spelling'):'')+
    (matches.length>eligible.length?' · '+total(matches.length-eligible.length)+' require individual review':'');
  function matchButton(){
    const remaining=eligible.filter(({product})=>!bulkSelected.has(product.id)).length;
    el('bulkmatches').textContent=remaining?'Select all '+total(eligible.length)+' matching':'All matches selected';
    if(!eligible.length)el('bulkmatches').textContent='Select matching products';
    el('bulkmatches').disabled=!remaining;
  }
  matchButton();
  el('bulkmatches').onclick=()=>{
    for(const {product} of eligible)if(!bulkSelected.has(product.id))bulkSelected.set(product.id,{});
    saveSelection();drawBulkResults();
  };
  const results=el('bulkhits');
  if(!matches.length){
    results.innerHTML='<div class="empty">'+esc(problem?'Adjust the range to see matching products.':'No products match these filters. Your earlier selections are still kept.')+'</div>';return;
  }
  results.innerHTML='<div class="bulk-scroll" tabindex="0" aria-label="Matching products"><table class="bulk-results"><thead><tr><th>Pick</th><th>Product</th><th>Till price</th><th>Supply price (excl. VAT)</th><th>Margin</th><th>Tags</th><th>Sales tax</th><th>Status</th></tr></thead><tbody>'+
    slice.items.map(({product:p,price,margin,close})=>'<tr'+(bulkSelected.has(p.id)?' class="picked"':'')+'><td><input type="checkbox" data-pick="'+esc(p.id)+'" aria-label="Select '+esc(p.name)+'" '+
      (bulkSelected.has(p.id)?'checked ':'')+(p.issues.length?'disabled ':'')+'></td><th scope="row"><label><span>'+esc(p.name)+'</span><small>'+esc(p.sku)+' · '+esc(p.row.product_category || 'Uncategorised')+'</small></label>'+
      (close?closeSpelling:'')+(p.issues.length?'<small>'+esc(p.issues.join(' '))+'</small>':'')+'</th><td>'+esc(money(price))+'</td><td>'+esc(displayCost(p.row.supply_price))+'</td><td>'+esc(margin===null?'Unknown':margin.toFixed(2)+'%')+'</td><td class="taglist">'+showTagNames(p.row.tags)+'</td>'+
      '<td>'+esc(p.row.tax_name || 'No tax setting')+'</td><td>'+esc(p.row.active==='1'?'Active':'Inactive')+'</td></tr>').join('')+
    '</tbody></table></div>'+pageControls(slice,matches.length,'bfpage');
  for(const box of results.querySelectorAll('[data-pick]')){
    const tr=box.closest('tr'),label=tr.querySelector('label');
    box.id='pick-'+box.dataset.pick;label.htmlFor=box.id;
    box.onchange=()=>{
      if(box.checked)bulkSelected.set(box.dataset.pick,{});
      else bulkSelected.delete(box.dataset.pick);
      tr.classList.toggle('picked',box.checked);saveSelection();bulkSelectionSummary();matchButton();
    };
  }
  bindPages('bfpage',step=>{bulkPage+=step;drawBulkResults();rememberPosition();el('bulkcount').scrollIntoView({block:'nearest'});});
}

    '<div class="bulkstatus" id="bulkmessage" role="status"></div><div id="bulkgrid"></div>'+

function sharedControl(){
  const wrap=el('bulkvaluewrap'),key=bulkColumn;
  const clearing=key==='tags' && bulkTagMode==='clear';
  if(key==='active' || key==='tax_name'){
    const options=key==='active'?[['','Choose status'],['0','Inactive'],['1','Active']]:
      [['','Choose sales tax'],...cat.taxes.map(t=>[t,t])];
    wrap.innerHTML=sel('New value','bulkvalue',options,bulkSharedValue);
  }else if(key==='tags'){
    const modes=[['add','Add tags'],['remove','Remove tags'],['replace','Replace all tags'],['clear','Clear all tags']];
    wrap.innerHTML=sel('Tag action','bulktagmode',modes,bulkTagMode)+
      (clearing?'<p class="small">This will empty the tag list on the selected products.</p>':
        field('Tags to '+(bulkTagMode==='replace'?'keep':bulkTagMode),'bulkvalue',bulkSharedValue,bulkTextFields.tags));
    el('bulktagmode').onchange=()=>{bulkTagMode=v('bulktagmode');sharedControl();};
  }else if(key==='description'){
    wrap.innerHTML='<label>New description<textarea id="bulkvalue" rows="2">\n'+esc(bulkSharedValue)+'</textarea></label>';
  }else{
    const options=bulkTextFields[key];
    wrap.innerHTML=field(options.label,'bulkvalue',bulkSharedValue,options);
  }
  if(el('bulkvalue'))el('bulkvalue').oninput=()=>{bulkSharedValue=v('bulkvalue');el('bulkapply').disabled=!bulkSharedValue.trim();};
  el('bulkapply').disabled=!clearing && !bulkSharedValue.trim();
}
function selectionCell(p,key,patch,prior){
  const current=Bulk.effective(p,key,prior),value=patch[key] ?? current;
  const changed=!E.equivalent(key,current,value),caption=Bulk.editable[key]+' for '+p.name;
  const attrs=' aria-label="'+esc(caption)+'" data-bulkcell="'+key+'" data-product="'+esc(p.id)+'"';
  let html;
  if(key==='active' || key==='tax_name'){
    let opts=key==='active'?[['1','Active'],['0','Inactive']]:cat.taxes.map(t=>[t,t]);
    if(!opts.some(([v])=>v===current))opts=[['','No current setting'],...opts];
    html='<select'+attrs+'>'+opts.map(([v,t])=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select>';
  }else if(key==='tags'){
    const tags=tagNames(value);
    html='<textarea rows="'+Math.min(5,Math.max(2,tags.length))+'" placeholder="No tags"'+attrs+'>\n'+esc(tags.join('\n'))+'</textarea>';
  }else if(key==='description'){
    html='<textarea rows="2"'+attrs+'>\n'+esc(value)+'</textarea>';
  }else{
    const options=bulkTextFields[key];
    html='<input type="text" autocomplete="off" '+(options.numeric?'inputmode="decimal" ':'')+(options.list?'list="'+options.list+'" ':'')+
      attrs+' value="'+esc(value)+'">';
  }
  return '<td data-review-field="'+key+'" class="'+(changed?'bulkchanged':'')+'">'+html+'</td>';
}
function drawSelection(){
  const pending=Bulk.pendingById(queue),rows=[...bulkSelected.keys()],slice=pageSlice(rows,selectionPage);
  const fields=reviewFields();
  selectionPage=slice.index;
  el('bulkgrid').innerHTML='<div class="bulk-scroll" tabindex="0" aria-label="Editable selection"><table class="bulkedits"><thead><tr>'+
    '<th>Product</th>'+fields.map(([key,label])=>'<th>'+esc(bulkHeadings[key] || label)+'</th>').join('')+'<th></th></tr></thead><tbody>'+
    slice.items.map(id=>{
      const p=cat.byId.get(id)[0],patch=bulkSelected.get(id),prior=pending.get(id)?.[0];
      return '<tr><th scope="row"><b>'+esc(p.name)+'</b><small>'+esc(p.sku)+(prior?' · already staged':'')+'</small></th>'+
        fields.map(([key])=>selectionCell(p,key,patch,prior)).join('')+
        '<td><button type="button" class="btn subtle" data-unpick="'+esc(id)+'" aria-label="Remove '+esc(p.name)+' from selection">Remove</button></td></tr>';
    }).join('')+'</tbody></table></div>'+pageControls(slice,rows.length,'bqpage')+
    [['bulkcategories',cat.categories],['bulktags',cat.tags],['bulkbrands',cat.brands]].map(([id,options])=>
      '<datalist id="'+id+'">'+options.map(t=>'<option value="'+esc(t)+'"></option>').join('')+'</datalist>').join('');
  for(const input of el('bulkgrid').querySelectorAll('[data-bulkcell]')){
    input.addEventListener(input.tagName==='SELECT'?'change':'input',()=>{
      const {product:id,bulkcell:key}=input.dataset,p=cat.byId.get(id)[0],patch=bulkSelected.get(id);
      const value=key==='tags'?input.value.replace(/\r\n?|\n/g,';'):input.value;
      if(key==='tags')input.rows=Math.min(5,Math.max(2,value.split(';').length));
      const changed=!E.equivalent(key,Bulk.effective(p,key,pending.get(id)?.[0]),value);
      if(changed)patch[key]=value;else delete patch[key];
      input.closest('td').classList.toggle('bulkchanged',changed);bulkNotice='';selectionStatus();saveSelection();
    });
  }
  for(const b of el('bulkgrid').querySelectorAll('[data-unpick]'))b.onclick=()=>{
    bulkSelected.delete(b.dataset.unpick);bulkNotice='';saveSelection();badge();showQueue();
  };
  bindPages('bqpage',step=>{selectionPage+=step;drawSelection();el('bulkgrid').scrollIntoView({block:'nearest'});});
  selectionStatus();
}
function selectionStatus(){
  const edits=[...bulkSelected.values()].filter(p=>Object.keys(p).length).length;
  el('bulkmessage').textContent=bulkNotice || (edits?plural(edits,'product')+' with proposed changes.':'Choose a shared value or edit a cell below.');
  el('bulkstage').disabled=!edits;
}
function bindBulkReview(){
  if(!el('bulkwork'))return;
  sharedControl();drawSelection();
  el('bulkmore').onclick=()=>goto('bulk');
  el('bulkfield').onchange=()=>{bulkColumn=v('bulkfield');bulkSharedValue='';bulkTagMode='add';sharedControl();};
  el('bulkapply').onclick=()=>{
    try{
      bulkSelected=Bulk.applyShared(cat,queue,bulkSelected,bulkColumn,v('bulkvalue'),bulkTagMode);
      bulkNotice='';saveSelection();drawSelection();
    }catch(x){el('bulkmessage').textContent=x.message;}
  };
  el('bulkclear').onclick=()=>{
    el('bulkconfirm').innerHTML='<div class="note">Remove all '+plural(bulkSelected.size,'product')+' from this selection and discard their unstaged bulk edits? <div class="actions">'+
      btn('Keep selection','bulkkeep','subtle')+btn('Clear these products','bulkdiscard')+'</div></div>';
    el('bulkkeep').onclick=()=>el('bulkconfirm').replaceChildren();
    el('bulkdiscard').onclick=()=>{bulkSelected.clear();bulkNotice='';selectionPage=0;saveSelection();badge();showQueue();};
  };
  el('bulkstage').onclick=async()=>{
    const stageButton=el('bulkstage');
    stageButton.disabled=true;
    try{
      // Verify original baselines before merging any overlapping single-product edits.
      reviewPreview(queue);
      const plan=Bulk.plan(cat,queue,bulkSelected,compactId);
      if(!plan.changed)throw Error('These values already match the catalogue or your staged edits.');
      reviewPreview(plan.queue);
      if(storage)await writeValues([['work',{queue:plan.queue,tempSets,history}],['bulk',bulkState(new Map())]]);
      queue=plan.queue;bulkSelected.clear();bulkSharedValue='';bulkTagMode='add';bulkNotice='';selectionPage=0;
      badge();showQueue();
      toast('Updated the draft for '+plural(plan.changed,'product')+(plan.skipped?' · '+total(plan.skipped)+' unchanged skipped':'')+'.');
    }catch(x){bulkNotice=x.message;el('bulkmessage').textContent=bulkNotice;stageButton.disabled=false;}
  };
}
const recordDrafts=new Map();
const recordFields={retail_price:'eretail', product_category:'ecat', tags:'etags', supply_price:'ecost',
  tax_name:'etax', active:'eactive', brand_name:'ebrand', description:'edescription'};

function sourceRevision(){return source.revision || source.hash;}
function recordDraft(product,pending){
  const version=sourceRevision()+'|'+(pending?.key || '');
  const saved=recordDrafts.get(product.id);
  if(saved?.version===version)return saved;
  const draft={version, fields:{...product.row,...pending?.fields},
    recipe:(pending?.recipe || E.catalogueRecipe(cat,product)).map(component=>({...component})),picker:null,query:''};
  recordDrafts.set(product.id,draft);
  return draft;
}
function recipeChoices(product){
  const existing=cat.products.filter(item=>item.id!==product.id && E.eligibleComponent(item)).map(item=>
    ({id:item.id,sku:item.sku,name:item.name,inactive:item.row.active==='0',staged:false,row:item.row}));
  for(const action of queue){
    if(action.kind==='standard' && action.fields.sku)existing.push({id:'',sku:action.fields.sku,name:action.fields.name,staged:true,row:action.fields});
  }
  return existing;
}
function showRecipe(product,draft,locked) {
  const panel=el('composite-recipe');
  if(!panel)return;
  const available=recipeChoices(product);
  function render(){
    panel.innerHTML='<div class="bar separate"><h3>Composite recipe</h3><span class="chip">'+draft.recipe.length+' component'+(draft.recipe.length===1?'':'s')+'</span></div>'+
      '<p class="small">Units of each component used when one '+esc(product.name)+' is sold. Enter whole or fractional units.</p>'+
      (draft.recipe.length?'<div class="tablewrap"><table class="recipe-table"><thead><tr><th>Stock item</th><th>Units per sale</th><th>Actions</th></tr></thead><tbody>'+
        draft.recipe.map((c,i)=>'<tr><th scope="row"><b>'+esc(c.name)+'</b><small>SKU '+esc(c.sku)+'</small></th><td>'+
          (locked?esc(c.quantity):'<input type="text" inputmode="decimal" aria-label="Units per sale for '+esc(c.name)+'" data-qty="'+i+'" value="'+esc(c.quantity)+'" autocomplete="off">')+
          '</td><td>'+(locked?'—':'<div class="bar"><button type="button" class="btn subtle" data-swap="'+i+'">Replace</button><button type="button" class="btn subtle" data-drop="'+i+'">Remove</button></div>')+
        '</td></tr>').join('')+'</tbody></table></div>':'<p class="small">Add a component before staging this recipe.</p>')+
      (locked?'':'<div class="actions">'+btn('Add component','recipe-add')+'</div>')+
      (draft.picker===null || locked?'':'<div class="recipe-picker"><div class="bar separate"><b>'+esc(draft.picker==='add'?'Add a stock item':'Replace '+draft.recipe[draft.picker].name)+'</b>'+
        btn('Cancel selection','recipe-cancel','subtle')+'</div>'+field('Find a component by name or SKU','recipe-search',draft.query,{placeholder:'Use any words from the name or a code'})+
        '<div class="base-options" id="recipe-results"></div></div>');
    if(locked)return;
    panel.querySelectorAll('[data-qty]').forEach(input=>input.oninput=()=>draft.recipe[Number(input.dataset.qty)].quantity=input.value);
    panel.querySelectorAll('[data-swap]').forEach(b=>b.onclick=()=>openPicker(Number(b.dataset.swap)));
    panel.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{
      draft.recipe.splice(Number(b.dataset.drop),1);draft.picker=null;draft.query='';render();
    });
    el('recipe-add').onclick=()=>openPicker('add');
    if(el('recipe-search')){
      el('recipe-cancel').onclick=()=>{draft.picker=null;draft.query='';render();};
      el('recipe-search').oninput=e=>{draft.query=e.target.value;results();};
      results();
    }
  }
  function openPicker(which){
    draft.picker=which;draft.query='';render();el('recipe-search').focus();
  }
  function results(){
    if(!draft.query.trim()){el('recipe-results').innerHTML='';return;}
    const used=new Set(draft.recipe.map(c=>norm(c.sku)));
    const hits=Search.rank(available.filter(c=>!used.has(norm(c.sku))),draft.query,c=>c.row,
      (a,b)=>Number(Boolean(a.inactive))-Number(Boolean(b.inactive))).slice(0,30);
    el('recipe-results').innerHTML=hits.map(({item:c,close},i)=>'<button type="button" class="stock-option" data-component="'+i+'"><strong>'+esc(c.name)+'</strong><small>'+esc(c.sku)+(c.staged?' · staged stock product':c.inactive?' · inactive':'')+'</small>'+(close?closeSpelling:'')+'</button>').join('') ||
      '<div class="empty">No available component matches. Items already in this recipe are listed above.</div>';
    el('recipe-results').querySelectorAll('[data-component]').forEach(button=>button.onclick=()=>{
      const item=hits[Number(button.dataset.component)].item, add=draft.picker==='add';
      const index=add?draft.recipe.length:draft.picker;
      const quantity=add?'1':draft.recipe[index].quantity;
      draft.recipe[index]={id:item.id,name:item.name,sku:item.sku,quantity};
      draft.picker=null;draft.query='';render();panel.querySelector('[data-qty="'+index+'"]').focus();
    });
  }
  render();
}
function detail() {
  const product=cat.byId.get(activeId)?.[0], panel=el('detail');
  if(!product){panel.innerHTML='<h2>Product details</h2><p class="muted">Select a matching product.</p>';return;}
  const pending=queue.filter(a=>a.kind==='edit' && a.id===product.id);
  const staged=pending[0],draft=recordDraft(product,staged),row=product.row;
  let reason=product.issues.join(' ');
  if(pending.length>1)reason='This product has several staged edits. Manage them in Review & export first.';
  else if(staged && !reason){
    try{reviewPreview([...queue.filter(a=>a.kind==='standard'),staged]);}
    catch(x){reason=x.message+' Remove the old draft in Review & export before rebuilding it.';}
  }
  const values=draft.fields;
  panel.innerHTML='<div class="bar separate"><span class="overline">Product record</span><span>'+fmtTag(product)+'</span></div><h2>'+esc(product.name)+'</h2>'+
    '<div class="currentline">SKU <span class="code">'+esc(product.sku)+'</span> · '+esc(row.product_category || 'No category')+'</div>'+
    '<div class="metricrow"><div class="metric"><small>Till price · incl. tax</small><strong>'+money(row.retail_price)+'</strong></div><div class="metric"><small>Supply price · per unit</small><strong>'+displayCost(row.supply_price)+'</strong></div></div>'+
    (reason?note(reason,'error'):staged?note('Showing your staged values. You can revise them here.'):'')+
    '<form id="editform"><fieldset class="record-inputs" '+(reason?'disabled':'')+'><div class="cols">'+
      field('Till price (£, incl. tax)','eretail',values.retail_price,{numeric:true})+
      field('Category','ecat',values.product_category,{list:'categories',hint:'Choose an existing category or enter a new top-level category.'})+'</div>'+
      field('Tags','etags',values.tags,{hint:'Separate multiple tags with semicolons. Clearing this field removes all tags.'})+
      (product.kind==='composite'?'<section class="recipe-panel" id="composite-recipe"></section>':'')+
      '<details><summary>Cost, tax and status</summary><div class="cols">'+field('Supply price (£ per unit, excl. tax)','ecost',values.supply_price,{numeric:true})+
      pickTax('etax',values.tax_name)+sel('Till status','eactive',[['1','Active'],['0','Inactive']],values.active)+
      (cat.headers.includes('brand_name')?field('Brand','ebrand',values.brand_name,{list:'brands'}):'')+'</div>'+
      (cat.headers.includes('description')?'<label>Description<textarea id="edescription" rows="3">\n'+esc(values.description)+'</textarea></label>':'')+'</details></fieldset>'+
      '<details><summary>Catalogue identity</summary><div class="small">Handle <span class="code">'+esc(product.handle)+'</span><br>Product ID <span class="code">'+esc(product.id)+'</span><br>Supplier '+esc(row.supplier_name||'Unassigned')+'</div></details>'+
      err()+'<div class="actions"><button class="btn primary" '+(reason?'disabled':'')+'>'+(staged?'Update staged change':'Stage change')+'</button></div></form>';
  const availableFields=Object.entries(recordFields).filter(([f,id])=>cat.headers.includes(f) && el(id));
  for(const [f,id] of availableFields)el(id).addEventListener('input',()=>{values[f]=v(id);});
  if(product.kind==='composite')showRecipe(product,draft,Boolean(reason));
  el('editform').onsubmit=e=>{
    e.preventDefault();
    try{
      if(reason)throw Error(reason);
      if(draft.picker!==null)throw Error('Choose a component or cancel the selection before staging.');
      const fields=Object.fromEntries(availableFields.map(([f])=>[f,values[f]??'']).filter(([f,value])=>value!==String(row[f]??'')));
      const action={kind:'edit',id:product.id,fields};
      if(product.kind==='composite' && E.recipeDifferences(E.catalogueRecipe(cat,product),draft.recipe).length){
        action.recipe=draft.recipe;action.recipeSource=sourceRevision();
      }
      const edits=Object.keys(fields).length || Object.hasOwn(action,'recipe');
      if(!edits && !staged)throw Error('Change a field or recipe component before staging.');
      const next=queue.slice();
      if(edits){
        const bound={...E.bind(cat,action),key:compactId()};
        // Validate this record separately so an existing batch cannot hide a no-op.
        const trial=reviewPreview([...queue.filter(a=>a.kind==='standard'),bound]);
        if(!trial.changes.some(c=>c.id===product.id))throw Error('The proposed values already match the catalogue.');
        if(staged)next[next.indexOf(staged)]=bound;else next.push(bound);
      }else next.splice(next.indexOf(staged),1);
      reviewPreview(next);queue=next;save();badge();recordDrafts.delete(product.id);detail();
      toast(edits?'Product change staged. Review it before exporting.':'Original values restored. This product is no longer staged.');
    }catch(x){formError(x);}
  };
}
const standardKeys=['name','sku','handle','category','retail','cost','tax','supplier','brand','tags','track','target','rate'];
function readStandardForm(prefix) {
  const values={};
  for(const name of standardKeys) if(el(prefix+name)) values[name]=v(prefix+name);
  values.manualPrice=el(prefix+'retail')?.dataset.manual === '1';
  values.manualMargin=el(prefix+'target')?.dataset.manual === '1';
  values.manualHandle=el(prefix+'handle')?.dataset.manual === '1';
  return values;
}
function restoreFields(prefix, values) {
  for(const key of standardKeys) if(el(prefix+key) && values[key]!=null) el(prefix+key).value=values[key];
  for(const [field,key] of [['retail','manualPrice'],['target','manualMargin'],['handle','manualHandle']]) {
    if(el(prefix+field))el(prefix+field).dataset.manual=values[key]?'1':'';
  }
}

      '<div id="'+pre+'categoryPicker"></div></div></div>'+

function rateFor(tax, manual) {
  if(!tax || tax===taxReview)return null;
  if(pricing.rates.has(tax))return pricing.rates.get(tax);
  return /^\d+(?:\.\d+)?$/.test(manual) && Number(manual)<=100 ? Number(manual) : null;
}
function standardBenchmark(category) {
  const result=Pricing.target(pricing.categories.get(category));
  if(result.percent!=null)return {percent:result.percent,why:'Median current margin of '+result.count+' active standard products in '+category+'.'};
  if(!S.portable && source.hash===S.hash && S.standardTarget!=null)return {percent:S.standardTarget,why:'Colab’s general catalogue target. Choose a category for a comparable-product median.'};
  return {percent:null,why:'Enter a target margin. At least three comparable costed products are needed for a catalogue suggestion.'};
}
function unusedSku(name) {
  const prefix='CD'+(slug(name).replace(/-/g,'').slice(0,12).toUpperCase() || 'ITEM');
  const reserved=new Set(cat.reservedSkus);
  for(const action of queue){
    if(action.kind==='standard' && action.fields.sku)reserved.add(norm(action.fields.sku));
    if(action.kind==='pours')for(const serve of action.pours)reserved.add(norm(serve.sku));
  }
  let i=1;while(reserved.has(norm(prefix+String(i).padStart(2,'0'))))i++;
  return prefix+String(i).padStart(2,'0');
}
function bindStandard(pre, values={}, onChange=()=>{}) {
  restoreFields(pre,values);
  const retail=el(pre+'retail'),margin=el(pre+'target'),cost=el(pre+'cost'),tax=el(pre+'tax'),name=el(pre+'name'),handle=el(pre+'handle');
  function compute(){
    const basis=standardBenchmark(v(pre+'category'));
    if(!margin.dataset.manual)margin.value=basis.percent ?? '';
    const rate=rateFor(tax.value,v(pre+'rate'));
    const askRate=Boolean(tax.value && tax.value!==taxReview && !pricing.rates.has(tax.value));
    el(pre+'ratebox').hidden=!askRate;
    const quote=Pricing.suggested(cost.value,margin.value,rate);
    if(!retail.dataset.manual) retail.value=quote ?? '';
    el(pre+'basis').textContent=(margin.dataset.manual?'Entered target. ':'')+basis.why;
    const actual=Pricing.achieved(cost.value,retail.value,rate);
    el(pre+'summary').textContent=quote==null?(tax.value===taxReview?'Tax needs review. Enter a till price to keep this product in the draft.':'Enter cost, a target below 100%, and a known tax rate for a suggestion.'):
      'Suggested till price '+money(quote)+' · tax '+rate+'%'+(actual!=null?' · margin at your price '+actual.toFixed(1)+'%':'')+(retail.dataset.manual?' · price overridden':'');
    el(pre+'use').disabled=quote==null;
    onChange();
  }
  name.oninput=()=>{if(!handle.dataset.manual)handle.value=slug(name.value);};
  handle.oninput=()=>{handle.dataset.manual=handle.value?'1':'';};
  el(pre+'code').onclick=()=>{el(pre+'sku').value=unusedSku(name.value);onChange();};
  margin.oninput=()=>{margin.dataset.manual=margin.value?'1':'';compute();};
  retail.oninput=()=>{retail.dataset.manual=retail.value!==''?'1':'';compute();};
  cost.oninput=compute;tax.onchange=()=>{el(pre+'rate').value='';compute();};
  el(pre+'rate').oninput=compute;
  el(pre+'use').onclick=()=>{retail.dataset.manual='';compute();};
  categoryPicker(pre,compute);compute();
}

    });
  }
}
function reviewPreview(actions) {
  const held=new Set(actions.filter(a=>a.kind==='standard' && a.fields.tax_name===taxReview).map(a=>a.fields.handle));
  if(!held.size)return {...E.preview(cat,actions),held};
  // Use a known tax only for structural validation. Held drafts never expose import files.
  const reviewing=actions.map(a=>a.kind==='standard' && held.has(a.fields.handle)?
    {...a,fields:{...a.fields,tax_name:'Default Tax'}}:a);
  const preview=E.preview(cat,reviewing);
  preview.files=[];
  for(const change of preview.changes)if(held.has(change.handle) && change.field==='tax_name')change.after=taxReview;
  return {...preview,held};
}
function stagedPanel() {
  if(!queue.length)return '<section class="box"><h2>No products staged</h2><p>Find a product or create a serve set to start a batch.</p></section>';
  const open=el('staged-items')?.open ? ' open' : '';
  return '<section class="box batchhead"><div class="bar separate"><h2>Your batch</h2><span class="chip">'+queue.length+' staged action'+(queue.length===1?'':'s')+'</span></div>'+
    '<details id="staged-items"'+open+'><summary>Manage staged items</summary>'+queue.map((action,i)=>'<div class="queueitem"><div><b>'+esc(actionTitle(action))+'</b><small>'+
    esc(action.kind==='edit'?'Existing product':action.kind==='standard'?'New standard product':action.pours.length+' new serves'+(action.temporary?' · review '+action.reviewDate:''))+
    '</small></div><button type="button" class="btn subtle" data-remove="'+i+'">Remove</button></div>').join('')+'</details>'+
    '<div class="actions">'+btn('Back up this draft','backup','subtle')+'</div></section>';
}
const columns=[['sku','SKU'],['retail_price','Till price (incl. VAT)'],['supply_price','Supply price (excl. VAT)'],['tags','Tags'],
  ['product_category','Category'],['tax_name','Sales tax'],['active','Active'],['track_inventory','Track stock'],['name','Till name'],['handle','Handle']];
function recordsFor(preview) {
  const result=new Map();
  for(const c of preview.changes) {
    const key=c.id || c.handle;
    if(!result.has(key)){
      const p=c.id?cat.byId.get(c.id)?.[0]:null;
      result.set(key,{name:c.name,kind:c.kind,before:p?.row || null,after:p?{...p.row}:{name:c.name,sku:c.sku,handle:c.handle},
        changed:new Set(),notes:[],composite:p?.kind==='composite' || c.kind==='New serve'});
    }
    const r=result.get(key);
    if(c.recipeChanges) {
      r.recipeChanges=c.recipeChanges;r.before={...r.before,recipe:c.before};r.after.recipe=c.after;r.changed.add('recipe');
    }
    else if(['Recipe','Supply price calculation'].includes(c.field))r.notes.push(c.after);
    else{r.after[c.field]=c.after;r.changed.add(c.field);}
  }
  return [...result.values()];
}
function productTable(preview,before) {
  const records=recordsFor(preview), fieldList=columns.slice();
  if(records.some(r=>r.recipeChanges))fieldList.push(['recipe','Recipe']);
  for(const [id,title] of [['brand_name','Brand'],['supplier_name','Supplier'],['description','Description']]){
    if(cat.headers.includes(id) || records.some(r=>r.changed.has(id)))fieldList.push([id,title]);
  }
  const rows=records.map(r=>{
    const data=before?r.before:r.after;
    const cells=fieldList.map(([field])=>{
      const value=data?.[field];
      let label=value || '—';
      if(data && field==='sku' && !value && !r.before)label='Assign on import';
      if(data && field==='tax_name' && value===taxReview)label='Needs review';
      if(data && field==='tags' && !value)label='No tags';
      if(data && field==='track_inventory' && r.composite && !value)label='From recipe';
      if(value==='1' && ['active','track_inventory'].includes(field))label='Yes';
      if(value==='0' && ['active','track_inventory'].includes(field))label='No';
      if(value!=null && value!=='' && field==='retail_price')label=money(value);
      if(value!=null && value!=='' && field==='supply_price')label=displayCost(value);
      if(!before && r.before && r.changed.has(field) && value==='')label='Cleared';
      const changed=!before && r.before && r.changed.has(field);
      let content=esc(label);
      if(field==='tags' && value)content=showTagNames(value);
      if(field==='description' && value && (value.length>90 || /[\r\n]/.test(value)))
        content='<details class="reviewdescription"><summary>View description</summary><span>'+esc(value)+'</span></details>';
      return '<td data-review-field="'+field+'"'+(changed?' class="changed" title="Changed field"':'')+'>'+content+'</td>';
    }).join('');
    return '<tr><th scope="row"><b>'+esc(r.name)+'</b><small>'+esc(r.before?'Edit':r.composite?'New serve':'New product')+'</small></th>'+cells+'</tr>';
  });
  return '<div class="tablewrap batchscroll" tabindex="0" aria-label="Scroll to see every product field"><table class="batchtable"><thead><tr><th>Product / action</th>'+
    fieldList.map(c=>'<th>'+esc(c[1])+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
}
function reviewDetails(preview) {
  const records=recordsFor(preview), recipes=records.filter(r=>r.notes.length);
  return '<section class="box"><div class="bar separate"><div><div class="overline">Change preview</div><h2>'+records.length+' product'+(records.length===1?'':'s')+'</h2></div>'+
    '<div class="modebar"><button type="button" class="modebtn" id="aftergrid" aria-pressed="true">After</button><button type="button" class="modebtn" id="beforegrid" aria-pressed="false">Before</button></div></div>'+
    '<p class="small">One row per product. Changed fields on existing products are highlighted. Scroll across for all attributes.</p><div id="recordgrid">'+productTable(preview,false)+'</div>'+
    (recipes.length?'<details><summary>Stock deductions and serving costs</summary>'+recipes.map(r=>'<h3>'+esc(r.name)+'</h3><p>'+r.notes.map(esc).join('<br>')+'</p>').join('')+'</details>':'')+
    records.filter(r=>r.recipeChanges).map(r=>'<div class="recipe-review"><h3>'+esc(r.name)+' · recipe changes</h3>'+
      recipeDifferenceTable(r.recipeChanges,false)+'</div>').join('')+
    preview.warnings.map(x=>note(x)).join('')+'</section>';
}
function recipeDifferenceTable(rows,verification) {
  const statuses={'Added':'Extra in the export','Removed':'Missing from the export','Units changed':'Different units','Identity changed':'Different stock item'};
  return '<div class="tablewrap"><table class="recipe-diff"><thead><tr><th>Component</th><th>Change</th><th>'+
    (verification?'Expected units':'Before')+'</th><th>'+(verification?'Units in export':'After')+'</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(r.name)+'<small>SKU '+esc(r.sku)+'</small></td><td>'+esc(verification?statuses[r.status]:r.status)+'</td>'+
      '<td>'+esc(r.before||'—')+'</td><td>'+esc(r.after||'—')+'</td></tr>').join('')+'</tbody></table></div>';
}
function recipeVerificationPanel() {
  const recent=new Map();
  for(const action of [...queue,...history.flatMap(h=>h.actions || [])]){
    if(action.kind==='edit' && Array.isArray(action.recipe) && !recent.has(action.id))recent.set(action.id,action);
  }
  if(!recent.size)return '';
  const rows=[...recent.values()].map(action=>{
    const label=esc(action.expected?.name || action.id);
    if(action.recipeSource===sourceRevision())return '<div class="recipe-check"><b>'+label+'</b><p>Load a fresh full catalogue after importing to check the saved recipe.</p></div>';
    const check=E.checkImportedRecipe(cat,action);
    return '<div class="recipe-check"><b>'+label+'</b> <span class="chip">'+esc(check.status)+'</span>'+
      (check.differences.length?recipeDifferenceTable(check.differences,true):'')+'</div>';
  });
  return '<section class="box"><div class="overline">After import</div><h2>Recipe checks</h2><p class="small">Compared with '+esc(source.label)+'. If an old component is still present, remove it in Lightspeed, save the product and load another full export.</p>'+rows.join('')+'</section>';
}
function holdPanel() {
  const held=queue.map((a,i)=>({a,i})).filter(({a})=>a.kind==='standard' && a.fields.tax_name===taxReview);
  if(!held.length)return '';
  return '<section class="box"><h2>Sales tax to review</h2><p>Choose the till tax for each held product and check its price. Export becomes available once the batch is resolved.</p>'+
    held.map(({a,i})=>'<div class="taxhold"><b>'+esc(a.fields.name)+'</b>'+pickTax('taxhold'+i)+
      field('Confirmed till price (£, incl. tax)','holdprice'+i,a.fields.retail_price,{numeric:true})+
      '<button type="button" class="btn" data-resolve="'+i+'">Confirm tax and price</button></div>').join('')+'</section>';
}
function bindReview(preview) {
  if(el('recordgrid')){
    const display=before=>{
      el('recordgrid').innerHTML=productTable(preview,before);
      el('beforegrid').setAttribute('aria-pressed',String(before));el('aftergrid').setAttribute('aria-pressed',String(!before));
    };
    el('beforegrid').onclick=()=>display(true);el('aftergrid').onclick=()=>display(false);
  }
  $$('[data-resolve]').forEach(b=>b.onclick=()=>{
    try{
      const i=Number(b.dataset.resolve),tax=v('taxhold'+i),price=v('holdprice'+i);
      if(!cat.taxes.includes(tax))throw Error('Choose an actual catalogue tax first.');
      const candidate=queue.map((a,j)=>i===j?{...a,fields:{...a.fields,tax_name:tax,retail_price:price}}:a);
      reviewPreview(candidate);queue=candidate;save();showQueue();
      toast('Tax and till price confirmed. Review the batch before export.');
    }catch(x){formError(x);}
  });
}
function importPanel(preview) {
  if(!preview.files.length)return '';
  if(bulkSelected.size)return '<section class="box"><h2>Lightspeed import files</h2><p>Stage the changes from your bulk selection above, or clear that selection, to export the reviewed batch.</p></section>';
  return '<section class="box"><div class="overline">Export</div><h2>Lightspeed import files</h2>'+
    '<p>Upload each file under Catalog → Products → Import, in the order shown. New stock comes first. Existing edits use separate files containing only the fields being changed.</p>'+
    '<label class="actions"><input type="checkbox" id="reviewed"> I have reviewed the products, prices and recipes.</label>'+
    preview.files.map((f,i)=>{
      const changed=f.label.startsWith('Existing ')?f.headers.filter(k=>E.editFields.includes(k)).map(k=>Bulk.editable[k] || labels[k] || k):[];
      return '<div class="queueitem"><div><b>'+f.step+'. '+esc(f.label)+'</b><small>'+f.rows.length+' spreadsheet row'+(f.rows.length===1?'':'s')+
        (changed.length?' · '+esc(changed.join(', ')):'')+'</small></div><div class="bar"><button class="btn primary" data-file="'+i+'" data-fmt="xlsx" disabled>XLSX</button><button class="btn" data-file="'+i+'" data-fmt="csv" disabled>CSV</button></div></div>';
    }).join('')+
    '<p class="small">XLSX keeps barcodes as text. Review the mappings in Lightspeed and load a fresh catalogue after importing.</p><div class="actions">'+btn('Archive this draft','archive','subtle')+'</div>'+
    '<p class="small">Archive after handling the files to retain any temporary serving list.</p></section>';
}
function showQueue() {
  let preview,message;
  const removeIndex=document.activeElement?.dataset?.remove;
  try{preview=reviewPreview(queue);}catch(x){message=x.message;}
  M.innerHTML=head('Catalogue','Review & export','Review the proposed product records together, then download their import sheets.')+
    bulkReviewPanel()+((queue.length || !bulkSelected.size)?stagedPanel():'')+err()+holdPanel()+(message?note('Export blocked. '+message,'error'):'')+
    (preview?.changes.length?reviewDetails(preview)+importPanel(preview):'')+recipeVerificationPanel()+tempPanel()+historyPanel();
  bindReview(preview);bindBulkReview();
  if(removeIndex!==undefined){
    const remaining=$$('[data-remove]');
    remaining[Math.min(Number(removeIndex),remaining.length-1)]?.focus({preventScroll:true});
  }
$$('[data-remove]').forEach(b=>b.onclick=()=>{queue.splice(Number(b.dataset.remove),1);save();badge();showQueue();});if(el('backup'))el('backup').onclick=backup;if(el('reviewed'))el('reviewed').onchange=()=>{$$('[data-file]').forEach(b=>b.disabled=!el('reviewed').checked);};$$('[data-file]').forEach(b=>b.onclick=async()=>{try{let current=reviewPreview(queue).files[Number(b.dataset.file)];if(!current||!el('reviewed').checked)throw Error('Review the changes first.');if(b.dataset.fmt==='xlsx')download(current.name.replace(/\.csv$/,'.xlsx'),await F.workbook(current));else download(current.name,current.csv,'text/csv;charset=utf-8');toast('File prepared. Review it in the Lightspeed importer.');}catch(x){formError(x);}});if(el('archive'))el('archive').onclick=()=>{let region=el('archive').parentElement;region.innerHTML='<div class="note"><b>Archive and clear the staged list?</b><p>The local archive will retain the product names and temporary serves. This does not import anything in Lightspeed.</p><div class="actions">'+btn('Keep editing','keepdraft','subtle')+btn('Archive and clear','yesarchive','primary')+'</div></div>';el('keepdraft').onclick=showQueue;el('yesarchive').onclick=()=>{history.unshift({at:new Date().toISOString(),names:queue.map(actionTitle),source:source.label,actions:queue});history=history.slice(0,25);for(let a of queue.filter(x=>x.kind==='pours'&&x.temporary))tempSets.push({id:compactId(),title:a.title,date:a.reviewDate,stock:a.baseSku,serves:a.pours.map(p=>({sku:p.sku,handle:p.handle,name:p.name}))});queue=[];save();badge();showQueue();};};bindTemp();}
const labels={retail_price:'Till price (£, incl. tax)',supply_price:'Unit supply price (£, excl. tax)',product_category:'Category',tags:'Tags',tax_name:'Sales tax',active:'Active (1/0)',track_inventory:'Track stock (1/0)',brand_name:'Brand',supplier_name:'Supplier',sku:'SKU',handle:'Handle',name:'Till name'};
function historyPanel(){return !history.length?'':'<section class="box"><h2>Archived drafts</h2>'+history.slice(0,8).map(h=>'<details><summary>'+esc(h.at.slice(0,10))+' · '+h.names.length+' staged item(s)</summary><p>'+esc(h.names.join(', '))+'</p><p class="small">Source: '+esc(h.source)+'. Import status is not checked automatically.</p></details>').join('')+'</section>';}
function tempPanel(){if(!tempSets.length)return '';return '<section class="box"><h2>Temporary serves</h2><p class="muted">Load a fresh export after the serves exist in Lightspeed. Retirement stages changes only to the matching sellable serves.</p>'+tempSets.map((t,i)=>'<div class="queueitem"><div><b>'+esc(t.title)+'</b><small>Review '+esc(t.date)+' · '+esc(t.serves.map(x=>x.sku).join(', '))+'</small></div><button class="btn subtle" data-retire="'+i+'">Stage retirement</button></div>').join('')+'</section>';}
function bindTemp(){$$('[data-retire]').forEach(b=>b.onclick=()=>{try{let t=tempSets[Number(b.dataset.retire)];let changes=[];for(let s of t.serves){let ps=cat.bySku.get(s.sku)||[],p=ps[0];if(ps.length!==1||p.kind!=='composite'||p.handle!==s.handle||p.name!==s.name||p.components.length!==1||p.components[0].composite_sku!==t.stock)throw Error('Cannot verify serve '+s.sku+' from this catalogue. Load a fresh complete export.');if(p.row.active==='1')changes.push({kind:'edit',id:p.id,fields:{active:'0'}});}if(!changes.length)throw Error('The verified serves are already inactive.');stage(changes);showQueue();toast('Retirement staged for the serve products only.');}catch(x){formError(x);}});}
function backup(){download('catalogue-desk-draft.json',JSON.stringify({deskVersion:1,sourceHash:source.hash,queue,tempSets},null,2),'application/json');}
function showSource() {
  const counts=cat?.counts, loaded=cat?'<section class="box narrow"><div class="overline">Current catalogue</div><h2>'+esc(source.label)+'</h2><div class="metricrow">'+
    [['Products',counts.products],['Recipe rows',counts.components],['Products needing review',counts.needsReview]].map(([k,n])=>'<div class="metric"><small>'+k+'</small><strong>'+n.toLocaleString('en-GB')+'</strong></div>').join('')+'</div>'+
    (cat.issues.length?note(cat.issues.join(' '),'error'):'')+
    '<details><summary>Source details and products held for review</summary><p class="small code">SHA-256 '+esc(source.hash)+'</p>'+
    cat.products.filter(p=>p.issues.length).map(p=>'<p>'+esc(p.name)+' · '+esc(p.sku)+' · '+esc(p.issues.join(' '))+'</p>').join('')+'</details></section>':'';
  M.innerHTML=head('Workspace',cat?'Catalogue source':'Load your catalogue',cat?'Refresh from a full Lightspeed product export before you prepare a batch.':'Choose a full Lightspeed product export to start using this copy of the desk.')+
    loaded+'<section class="box narrow"><div class="overline">Lightspeed Retail X-Series</div><h2>'+(cat?'Replace catalogue':'Choose your product export')+'</h2>'+
    '<p>Open <b>Catalog → Products</b> in your till, clear filters, include active and inactive products, then choose <b>Export list → XLSX format</b>. The desk reads the original product and recipe rows.</p>'+
    '<form id="sourceform"><label class="actions"><input type="checkbox" id="fullsource" required> This export includes the full product list and recipe rows.</label>'+
    '<label>Product export (.xlsx or .csv)<input id="catfile" type="file" accept=".xlsx,.csv" required></label><button class="btn primary">Load catalogue</button></form>'+
    err()+'<p class="fieldnote">Your file and drafts stay in this browser. Loading a catalogue clears the unstaged bulk selection and checks staged edits against the new file.</p></section>'+
    '<section class="box narrow"><h2>Using the desk on another computer</h2>'+
    (S.portable?'<p>This portable HTML opens with an empty catalogue for a new recipient. Send the original HTML file. Each person loads their own shop export here.</p>':
    '<p>This personal edition includes the shop snapshot. To share the editor on its own, send <b>Portable Catalogue Desk.html</b> from the pack. That edition starts empty and accepts the recipient’s fresh export.</p>')+
    '<p class="small">A browser remembers a loaded catalogue and staged work where storage is available. A draft backup contains proposed changes and temporary serving lists.</p>'+
    (!cat?'':'<div class="actions">'+btn('Download draft backup','srcbackup','subtle')+'</div><label>Restore a saved draft<input id="restore" type="file" accept=".json"></label><div id="restorebox"></div>')+'</section>';
  if(el('srcbackup'))el('srcbackup').onclick=backup;
  el('sourceform').onsubmit=async e=>{
    e.preventDefault();const button=$('button',el('sourceform'));button.disabled=true;
    try{
      const file=el('catfile').files[0], result=await F.readCatalogue(file), verified=E.index(result.rows);
      const next={label:file.name+' · loaded '+new Date().toLocaleDateString('en-GB'),hash:result.hash,rows:result.rows,revision:compactId()};
      if(storage)await writeValues([['catalogue',next],['bulk',null]]);
      source=next;cat=verified;setPricing();activeId='';recordDrafts.clear();standardDraft={};pourDraft=null;pourWork.wine=null;pourWork.beer=null;
      resetBulk();goto(queue.some(a=>a.recipe)?'queue':bulkLanding?'bulk':'search');bulkLanding=false;toast(storage?'Catalogue loaded. Staged items will be checked against it.':'Catalogue loaded for this session.');
    }catch(x){formError(x);}finally{button.disabled=false;}
  };
  if(el('restore'))el('restore').onchange=async e=>{
    const area=el('restorebox');area.replaceChildren();
    try{
      const file=e.target.files[0];
      if(!file || file.size>4e6)throw Error('Choose a desk draft under 4 MB.');
      const data=JSON.parse(await file.text());
      if(data.deskVersion!==1 || !Array.isArray(data.queue) || !Array.isArray(data.tempSets) || data.queue.length>5000)throw Error('This is not a supported desk draft.');
      if(data.queue.some(a=>(a.kind==='edit'&&!a.expected)||(a.kind==='pours'&&cat.bySku.has(a.baseSku)&&!a.expectedBase)))throw Error('The original product values are missing. Recreate that change.');
      reviewPreview(data.queue);
      area.innerHTML='<div class="note">Replace this browser’s staged list with '+data.queue.length+' saved actions? <div class="actions">'+btn('Keep current draft','keeprestore','subtle')+btn('Restore this draft','yesrestore','primary')+'</div></div>';
      el('keeprestore').onclick=()=>area.replaceChildren();
      el('yesrestore').onclick=()=>{
        queue=data.queue;tempSets=data.tempSets.filter(t=>typeof t.title==='string'&&Array.isArray(t.serves));recordDrafts.clear();save();goto('queue');
      };
    }catch(x){formError(x);}
  };
}
async function init() {
  try {
    try{storage=await db();}catch{}
    const stored=storage?await read('catalogue'):null;
    source=stored || (S.rows.length?{label:S.label,hash:S.hash,rows:S.rows}:null);
    cat=source?E.index(source.rows):null;
    if(cat)setPricing();
    const saved=storage?await read('work'):null;
    queue=saved?.queue || [];tempSets=saved?.tempSets || [];history=saved?.history || [];
    if(storage && cat)restoreSelection(await read('bulk'));
    buttons();initialPage();
    if(!storage)toast('Drafts last for this session. Use Download draft to keep your changes.');
  }catch(e){M.innerHTML='<h1>Catalogue could not open</h1>'+note(e.message,'error');}
}
init();
})();
